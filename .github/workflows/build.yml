name: Build & Release (iOS App Store + Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Custom iOS Build Number (optional - leave empty to use pubspec.yaml)'
        required: false
        type: string

jobs:
  # ══════════════════════════════════════════════════════════
  # بناء وتوزيع iOS إلى App Store Connect / TestFlight
  # ══════════════════════════════════════════════════════════
  build-ios:
    name: 🍎 Build & Upload iOS to App Store
    runs-on: macos-14
    timeout-minutes: 60

    env:
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚙️ Disable Swift Package Manager (Enforce CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: ⚙️ Configure Firebase (GoogleService-Info.plist)
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          python3 -c "
          import os, base64
          raw = os.environ.get('GOOGLE_SERVICE_INFO_PLIST_BASE64', '').strip()
          dest = 'ios/Runner/GoogleService-Info.plist'
          if raw:
              if raw.startswith('<?xml') or '<plist' in raw:
                  data = raw.encode('utf-8')
              else:
                  data = base64.b64decode(raw)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              with open(dest, 'wb') as f:
                  f.write(data)
              print('✅ GoogleService-Info.plist decoded and saved successfully')
          elif os.path.exists(dest):
              print('ℹ️ Using existing GoogleService-Info.plist from repository')
          else:
              print('⚠️ Warning: No GoogleService-Info.plist found!')
          "

      - name: 📦 Flutter pub get
        run: flutter pub get

      - name: ☕ Prepare iOS Plugins & CocoaPods
        run: |
          pod repo update
          flutter build ios --config-only --release --no-codesign

      - name: 🔑 Import Apple Distribution Certificate to Keychain
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 || secrets.CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'build_temp_keychain_pwd' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          python3 -c "
          import base64, os, sys, re
          raw = os.environ.get('APPLE_CERTIFICATE_BASE64', '').strip()
          if not raw:
              print('::error::Secret APPLE_CERTIFICATE_BASE64 is empty or missing!')
              sys.exit(1)
          clean = re.sub(r'\s+', '', raw)
          pad = len(clean) % 4
          if pad:
              clean += '=' * (4 - pad)
          try:
              data = base64.b64decode(clean)
              with open('$CERT_PATH', 'wb') as f:
                  f.write(data)
              print(f'✅ Decoded certificate.p12 successfully ({len(data)} bytes)')
          except Exception as e:
              print(f'::error::Failed to decode certificate base64: {e}')
              sys.exit(1)
          "

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "✅ Certificate imported to temporary keychain and search list configured"

      - name: 📜 Install Provisioning Profile & Verify Capabilities
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          python3 -c "
          import base64, os, sys, re
          raw = os.environ.get('PROVISIONING_PROFILE_BASE64', '').strip()
          if not raw:
              print('::error::Secret PROVISIONING_PROFILE_BASE64 is empty or missing!')
              sys.exit(1)
          clean = re.sub(r'\s+', '', raw)
          pad = len(clean) % 4
          if pad:
              clean += '=' * (4 - pad)
          try:
              data = base64.b64decode(clean)
              with open('$PP_PATH', 'wb') as f:
                  f.write(data)
              print(f'✅ Decoded profile.mobileprovision successfully ({len(data)} bytes)')
          except Exception as e:
              print(f'::error::Failed to decode provisioning profile base64: {e}')
              sys.exit(1)
          "

          python3 -c "
          import plistlib, os, shutil
          with open('$PP_PATH', 'rb') as f:
              c = f.read()
          s = c.find(b'<?xml')
          e = c.find(b'</plist>') + 8
          p = plistlib.loads(c[s:e])
          uuid = p.get('UUID', 'profile')
          name = p.get('Name', 'goldsham')
          ent = p.get('Entitlements', {})

          dest_dir = os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles')
          os.makedirs(dest_dir, exist_ok=True)
          shutil.copy('$PP_PATH', os.path.join(dest_dir, f'{uuid}.mobileprovision'))
          shutil.copy('$PP_PATH', os.path.join(dest_dir, 'goldsham.mobileprovision'))
          print(f'✅ Provisioning profile installed: {name} (UUID: {uuid})')
          print(f'   App Identifier: {ent.get(\"application-identifier\")}')
          print(f'   Push Notifications (aps-environment): {ent.get(\"aps-environment\", \"NOT CONFIGURED IN PROFILE\")}')
          if 'aps-environment' not in ent:
              print('::warning::Provisioning profile does NOT include Push Notifications entitlement. Remote notifications require this capability in Apple Developer Portal!')
          "

      - name: 🔨 Build iOS IPA
        run: |
          BUILD_CMD="flutter build ipa --release --export-options-plist=ios/ExportOptions.plist"
          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_CMD="$BUILD_CMD --build-number=${{ inputs.build_number }}"
            echo "Using custom build number: ${{ inputs.build_number }}"
          fi
          echo "Running: $BUILD_CMD"
          $BUILD_CMD

      - name: 💾 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: 🚀 Validate & Upload to App Store Connect / TestFlight
        if: env.APP_STORE_CONNECT_API_KEY_BASE64 != '' && env.APP_STORE_CONNECT_KEY_ID != '' && env.APP_STORE_CONNECT_ISSUER_ID != ''
        run: |
          python3 -c "
          import base64, os
          raw = os.environ.get('APP_STORE_CONNECT_API_KEY_BASE64', '').strip()
          if raw.startswith('-----BEGIN'):
              data = raw.encode('utf-8')
          else:
              data = base64.b64decode(raw)

          key_id = os.environ['APP_STORE_CONNECT_KEY_ID']
          paths = [
              os.path.expanduser(f'~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8'),
              os.path.expanduser(f'~/.private_keys/AuthKey_{key_id}.p8'),
          ]
          for p in paths:
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, 'wb') as f:
                  f.write(data)
          print('✅ App Store Connect API Key installed successfully')
          "

          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "::error::No IPA file found in build/ios/ipa!"
            exit 1
          fi
          echo "Found IPA: $IPA_FILE"

          echo "🔍 Step 1: Validating app with App Store Connect..."
          xcrun altool --validate-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --show-progress

          echo "🚀 Step 2: Uploading app to App Store Connect..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --show-progress

      - name: 🧹 Clean up Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain || true


  # ══════════════════════════════════════════════════════════
  # بناء Android (يتم تشغيله فقط في حال وجود Keystore Secret)
  # ══════════════════════════════════════════════════════════
  build-android:
    name: 🤖 Build Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode Keystore
        id: check_keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "::warning::KEYSTORE_FILE secret is not set. Skipping signed Android build."
          else
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "$KEYSTORE_FILE" | base64 --decode > android/app/release.jks
          fi

      - name: Build APK
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=KEYSTORE_PATH=release.jks

      - name: Build App Bundle (AAB)
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload APK
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
